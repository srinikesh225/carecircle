<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>icon</title>
    <style>
      * {
        margin: 0;
      }
      html,
      body {
        width: 100vw;
        height: 100vh;
        overflow: hidden;
        background: #3e5c2b;
      }
      svg {
        display: block;
        width: 100vw;
        height: 100vh;
      }
    </style>
  </head>
  <body>
    <!-- Full-bleed square: platforms (iOS, Android maskable) apply their own corner masks. Mark kept inside the 80% safe zone. -->
    <svg viewBox="0 0 32 32">
      <rect width="32" height="32" fill="#3E5C2B" />
      <circle cx="16" cy="16.8" r="6.8" fill="none" stroke="#FCFCF9" stroke-width="2.4" />
      <circle cx="16" cy="10" r="2.8" fill="#D6CD27" />
    </svg>
  </body>
</html>
